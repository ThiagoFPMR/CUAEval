# Example CUAEval plan: test three Holo3 checkpoints on OSWorld, back to back.
# The first two serve on a vast.ai box (process-based, S3 weights); the third
# serves locally in Docker from already-downloaded weights.
#
#   cuaeval check plans/example.yaml          # validate + show resolved jobs
#   cuaeval run   plans/example.yaml --dry-run
#   cuaeval run   plans/example.yaml          # for real (needs the box + VMs)

osworld_repo: /home/thiago/Workspace/Research/OSWorld
# osworld_python defaults to <repo>/.venv/bin/python when present.

# Values every job inherits unless it overrides them.
defaults:
  runner: holo3                                     # -> run_multienv_holo3.py
  meta: evaluation_examples/test_nogdrive.json
  result_dir: ./results
  max_steps: 15
  num_envs: 4
  provider_name: vmware
  # Passed straight through to the OSWorld runner (matches run_osworld_holo3_here.sh):
  runner_args:
    - --headless
    - --observation_type
    - screenshot
    - --sleep_after_execution
    - "3"
    - --client_password
    - password
  serve:
    location: remote
    framework: sglang
    ssh_host: vastai            # your ~/.ssh/config alias for the instance
    port: 60000                 # server port on the instance
    tunnel_port: 9091           # local port CUAEval forwards it to
    tp: 1
    context_length: 32768
    remote_models_dir: /models

jobs:
  - label: holo3-gimp-pruned-half
    weights: s3://omnibrowse-s3/models/holo3-gimp-pruned-half

  - label: holo3-gimp-pruned-quarter
    weights: s3://omnibrowse-s3/models/holo3-gimp-pruned-quarter

  # A locally-served model (Docker on this host) from already-downloaded weights.
  - label: holo3-gimp-local
    weights: /models/holo3-gimp-pruned
    serve:
      location: local
      framework: sglang         # image auto-pinned; override with serve.image
      port: 60000
      tp: 1
