[project]
name = "cuaeval"
version = "0.1.0"
description = "Config-driven harness for sequentially testing computer-use-agent models on benchmarks (OSWorld), with local Docker serving or vast.ai remote process serving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
cuaeval = "cuaeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cuaeval"]
